# Job containers get the host docker.sock automounted via the runner's own
# config.yaml (container.docker_host: automount), not anything set here --
# see docs/services/forgejo.md.
name: CD

"on":
  push:
    branches: [develop]
    tags: ["v*.*.*"]

defaults:
  run:
    working-directory: trade-pipeline

jobs:
  publish:
    # Self-hosted registry (Forgejo's built-in PyPI index + container registry,
    # see docs/services/forgejo.md) -- everything lands on our own disk, no
    # third-party account, no quota.
    runs-on: docker
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"

      # A pushed v* tag is a deliberate release: the tag *is* the version,
      # nothing auto-bumps it. A plain push to develop is a continuous dev
      # build: auto-versioned, never collides, never gets `latest`.
      - name: Determine channel and version
        run: |
          BASE=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "${{ github.ref_type }}" = "tag" ]; then
            CHANNEL=prod
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            if [ "$VERSION" != "$BASE" ]; then
              echo "::error::Tag v$VERSION doesn't match pyproject.toml's version ($BASE) -- bump pyproject.toml to $VERSION and re-tag, or fix the tag."
              exit 1
            fi
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" \
              "${{ github.server_url }}/api/v1/packages/${{ github.repository_owner }}/pypi/trade-pipeline/$VERSION")
            if [ "$STATUS" = "200" ]; then
              echo "::error::trade-pipeline $VERSION is already published -- this tag was reused after a release. Bump pyproject.toml and push a new tag instead."
              exit 1
            fi
          else
            CHANNEL=dev
            # A new commit gets a new number (1, 2, 3, ...). A retry of the
            # *same* commit reuses the same number on purpose -- same code
            # should mean same artifact, so --check-url below just skips the
            # re-publish instead of erroring, rather than minting a pointless
            # new version for content that didn't change.
            VERSION="${BASE}.dev${{ github.run_number }}"
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          fi
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "PKG_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing $CHANNEL version $VERSION"

      # The Dockerfile's `uv sync --locked` fails if uv.lock's recorded
      # project version doesn't match pyproject.toml -- re-lock after the
      # dev-channel version bump above so the image build stays in sync.
      # A no-op for prod (pyproject.toml wasn't touched) but cheap either way.
      - name: Re-lock
        run: uv lock

      - name: Build package
        run: uv build

      # --check-url makes this idempotent: a retried run reuses the same
      # run_number/version, and uv skips files the index already has instead
      # of erroring on them -- so re-running a partially-failed job (e.g. the
      # image push failed after the package already uploaded) just works.
      - name: Publish package
        env:
          UV_PUBLISH_USERNAME: ${{ github.repository_owner }}
          UV_PUBLISH_PASSWORD: ${{ secrets.CD_DEPLOY_TOKEN }}
        run: |
          uv publish \
            --publish-url "${{ github.server_url }}/api/packages/${{ github.repository_owner }}/pypi" \
            --check-url "${{ github.server_url }}/api/packages/${{ github.repository_owner }}/pypi/simple/"

      - name: Log in to the container registry
        run: |
          REGISTRY=$(echo "${{ github.server_url }}" | sed -E 's#^https?://##')
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
          echo "${{ secrets.CD_DEPLOY_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.repository_owner }}" --password-stdin

      # `latest` only ever points at a real tagged release -- a dev image
      # never gets that tag, so nothing pulling `latest` can land on an
      # unreleased build.
      - name: Build and push image
        run: |
          IMAGE="$REGISTRY/${{ github.repository }}"
          if [ "$CHANNEL" = "prod" ]; then
            docker build -t "$IMAGE:$PKG_VERSION" -t "$IMAGE:latest" .
            docker push "$IMAGE:$PKG_VERSION"
            docker push "$IMAGE:latest"
          else
            docker build -t "$IMAGE:dev" -t "$IMAGE:dev-$PKG_VERSION" .
            docker push "$IMAGE:dev"
            docker push "$IMAGE:dev-$PKG_VERSION"
          fi

      # The actual "what build happened" record: a Forgejo Release tying the
      # tag to the exact package + image coordinates it produced.
      - name: Create Forgejo release
        if: env.CHANNEL == 'prod'
        run: |
          BODY=$(cat <<EOF
          Package: \`trade-pipeline==${PKG_VERSION}\` on this repo's PyPI registry
          Image: \`${REGISTRY}/${{ github.repository }}:${PKG_VERSION}\` (also tagged \`latest\`)
          EOF
          )
          curl -sk -X POST "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases" \
            -H "Authorization: token ${{ secrets.CD_DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c 'import json,sys; print(json.dumps({"tag_name": sys.argv[1], "name": sys.argv[1], "body": sys.argv[2]}))' "${{ github.ref_name }}" "$BODY")"
