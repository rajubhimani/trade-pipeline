name: CICD

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Prod releases are manually dispatched, not triggered by pushing a v* tag.
  # Reacting to an already-pushed tag means the tag (and its commit) always
  # pre-date the release-creation API call -- Forgejo backdates the release's
  # timestamp to that commit's own date rather than "now" in that case (a
  # known Gitea/Forgejo rough edge: go-gitea/gitea#13004, #21681). Creating
  # the tag *from* this job instead (like the dev channel already does via
  # target_commitish) avoids a pre-existing tag entirely, so there's nothing
  # to backdate against -- matches how established release tooling (e.g.
  # JReleaser) does it: the release job owns tag creation, it doesn't react
  # to one.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release -- must match pyproject.toml exactly, e.g. 0.1.2"
        required: true
        type: string

defaults:
  run:
    working-directory: trade-pipeline

jobs:
  # Forgejo triggers a fresh workflow run per ref-event, with no built-in
  # dedup across events that happen to point at the same commit (e.g. a
  # manual workflow_dispatch run against a commit whose own push-triggered
  # check just ran, or minutes/weeks later). Re-testing an identical commit
  # is pure wasted compute on this self-hosted runner -- this job checks
  # Forgejo's own commit-status API for an already-successful `check` on
  # this exact SHA and skips the matrix if one exists. `publish` still only
  # proceeds once a successful check exists for this SHA (fresh or reused),
  # so this saves compute without weakening the safety gate.
  gate:
    runs-on: docker
    # Overrides the workflow-level working-directory: trade-pipeline -- this
    # job never checks out the repo, so that directory wouldn't exist.
    defaults:
      run:
        working-directory: .
    outputs:
      already_passed: ${{ steps.probe.outputs.already_passed }}
    steps:
      - id: probe
        # Prefix is derived from github.workflow (this file's own `name:`),
        # not hardcoded -- a hardcoded "CI / check (" already broke silently
        # once, the moment this workflow got renamed to CICD (commit-status
        # contexts are "<name> / <job> (<event>)", so the prefix must track
        # whatever `name:` actually is, always).
        run: |
          COUNT=$(curl -sk "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/commits/${{ github.sha }}/status" \
            -H "Authorization: token ${{ secrets.CD_DEPLOY_TOKEN }}" | \
            WORKFLOW_NAME="${{ github.workflow }}" python3 -c "import json,os,sys; d=json.load(sys.stdin); prefix=os.environ['WORKFLOW_NAME']+' / check ('; print(len({s['context'] for s in d.get('statuses',[]) if s['context'].startswith(prefix) and s['status']=='success'}))")
          if [ "$COUNT" -ge 4 ]; then
            echo "already_passed=true" >> "$GITHUB_OUTPUT"
            echo "Commit ${{ github.sha }} already has a passing check ($COUNT/4) -- skipping the matrix."
          else
            echo "already_passed=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: gate
    if: needs.gate.outputs.already_passed != 'true'
    # This mirror only picks up .forgejo/workflows/ -- Forgejo Actions doesn't
    # read .github/workflows/, so this is a separate copy of that CI job (see
    # docs/services/forgejo.md for the self-hosted runner setup).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The project's full requires-python range (pyproject.toml) — proves
        # version-compat claims are actually true, not just true on whatever
        # interpreter a developer happens to have active locally.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    # Real Postgres + Redis, matching docker-compose.yml's versions — the
    # test suite talks to real services (tests/conftest.py), not
    # SQLite/fakeredis substitutes. Unlike GitHub-hosted runners (job runs
    # directly on the VM, so services: land on localhost), Forgejo's runner
    # executes the job inside its own container on a per-job docker network
    # -- services are reachable by container name, not localhost, hence the
    # TEST_*_DSN/URL overrides below (tests/conftest.py already supports them).
    env:
      TEST_POSTGRES_DSN: postgresql+psycopg://trade_pipeline:trade_pipeline@postgres:5432/trade_pipeline
      TEST_POSTGRES_ASYNC_DSN: postgresql+asyncpg://trade_pipeline:trade_pipeline@postgres:5432/trade_pipeline
      TEST_REDIS_URL: redis://redis:6379
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: trade_pipeline
          POSTGRES_PASSWORD: trade_pipeline
          POSTGRES_DB: trade_pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest tests/ -n auto -v

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit

  # Only runs after `check` succeeds (or is legitimately skipped because this
  # exact commit already passed) -- a `needs:` dependency inside one
  # workflow, not a separate workflow_run-triggered file, since job-level
  # `needs:` is guaranteed to work here whereas cross-workflow triggers are a
  # less certain bet on this Forgejo version. `check` being skipped would
  # normally skip this too (Actions propagates skips through `needs`
  # automatically); always() plus the explicit result check below overrides
  # that so a *legitimately skipped* check doesn't block publishing, while a
  # *failed or cancelled* one still does.
  # Gated to develop pushes (dev channel) and manual dispatch (prod channel)
  # only -- not pull_request, not a plain push to main.
  publish:
    needs: [gate, check]
    if: >-
      always() &&
      needs.check.result != 'failure' && needs.check.result != 'cancelled' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
       github.event_name == 'workflow_dispatch')
    # Job containers get the host docker.sock automounted via the runner's
    # own config.yaml (container.docker_host: automount), not anything set
    # here -- see docs/services/forgejo.md in the homeserver repo. An
    # isolated Docker-in-Docker sidecar was tried and reverted there: it
    # broke this job specifically, since docker build/push would have needed
    # a THIRD level of nested DinD, which crashed on startup every time.
    # Self-hosted registry (Forgejo's built-in PyPI index + container
    # registry, see docs/services/forgejo.md) -- everything lands on our own
    # disk, no third-party account, no quota.
    runs-on: docker
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"

      # A manual dispatch is a deliberate release: the input version *is* the
      # version, nothing auto-bumps it. A plain push to develop is a
      # continuous dev build: auto-versioned, never collides, never gets
      # `latest`.
      - name: Determine channel and version
        run: |
          BASE=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # workflow_dispatch lets the caller pick *any* ref to run against --
            # without this, dispatching against develop would cut a "prod"
            # release straight from the working branch, bypassing main (and
            # whatever review/merge discipline main is supposed to represent)
            # entirely.
            if [ "${{ github.ref }}" != "refs/heads/main" ]; then
              echo "::error::Prod releases must be dispatched from main (got ${{ github.ref_name }}) -- merge develop into main first, then dispatch from main."
              exit 1
            fi
            CHANNEL=prod
            VERSION="${{ inputs.version }}"
            if [ "$VERSION" != "$BASE" ]; then
              echo "::error::Requested version $VERSION doesn't match pyproject.toml's version ($BASE) -- bump pyproject.toml to $VERSION first, or dispatch with the right version."
              exit 1
            fi
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" \
              "${{ github.server_url }}/api/v1/packages/${{ github.repository_owner }}/pypi/trade-pipeline/$VERSION")
            if [ "$STATUS" = "200" ]; then
              echo "::error::trade-pipeline $VERSION is already published -- bump pyproject.toml to a new version before releasing again."
              exit 1
            fi
          else
            CHANNEL=dev
            # A new commit gets a new number (1, 2, 3, ...). A retry of the
            # *same* commit reuses the same number on purpose -- same code
            # should mean same artifact, so --check-url below just skips the
            # re-publish instead of erroring, rather than minting a pointless
            # new version for content that didn't change.
            VERSION="${BASE}.dev${{ github.run_number }}"
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          fi
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "PKG_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing $CHANNEL version $VERSION"

      # The Dockerfile's `uv sync --locked` fails if uv.lock's recorded
      # project version doesn't match pyproject.toml -- re-lock after the
      # dev-channel version bump above so the image build stays in sync.
      # A no-op for prod (pyproject.toml wasn't touched) but cheap either way.
      - name: Re-lock
        run: uv lock

      - name: Build package
        run: uv build

      # --check-url makes this idempotent: a retried run reuses the same
      # run_number/version, and uv skips files the index already has instead
      # of erroring on them -- so re-running a partially-failed job (e.g. the
      # image push failed after the package already uploaded) just works.
      - name: Publish package
        env:
          UV_PUBLISH_USERNAME: ${{ github.repository_owner }}
          UV_PUBLISH_PASSWORD: ${{ secrets.CD_DEPLOY_TOKEN }}
        run: |
          uv publish \
            --publish-url "${{ github.server_url }}/api/packages/${{ github.repository_owner }}/pypi" \
            --check-url "${{ github.server_url }}/api/packages/${{ github.repository_owner }}/pypi/simple/"

      - name: Log in to the container registry
        run: |
          REGISTRY=$(echo "${{ github.server_url }}" | sed -E 's#^https?://##')
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
          echo "${{ secrets.CD_DEPLOY_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.repository_owner }}" --password-stdin

      # `latest` only ever points at a real tagged release -- a dev image
      # never gets that tag, so nothing pulling `latest` can land on an
      # unreleased build.
      - name: Build and push image
        run: |
          IMAGE="$REGISTRY/${{ github.repository }}"
          if [ "$CHANNEL" = "prod" ]; then
            docker build -t "$IMAGE:$PKG_VERSION" -t "$IMAGE:latest" .
            docker push "$IMAGE:$PKG_VERSION"
            docker push "$IMAGE:latest"
          else
            docker build -t "$IMAGE:dev" -t "$IMAGE:dev-$PKG_VERSION" .
            docker push "$IMAGE:dev"
            docker push "$IMAGE:dev-$PKG_VERSION"
          fi

      # The actual "what build happened" record: a Forgejo Release tying a
      # tag to the exact package + image coordinates it produced -- for both
      # channels, so dev builds show up in Releases too, not just tagged ones.
      #
      # Both channels create their tag *here*, via target_commitish, rather
      # than reacting to a tag pushed beforehand -- see the workflow_dispatch
      # comment up top for why (avoids Forgejo backdating the release to the
      # tag's commit date instead of "now").
      #
      # Dev releases are tagged `dev-<version>` (no `v` prefix), distinct
      # from prod's `v<version>`, so the two can never collide.
      - name: Create Forgejo release
        run: |
          BODY=$(cat <<EOF
          Package: \`trade-pipeline==${PKG_VERSION}\` on this repo's PyPI registry
          Image: \`${REGISTRY}/${{ github.repository }}:${PKG_VERSION}\`$( [ "$CHANNEL" = "prod" ] && echo ' (also tagged `latest`)' || echo ' (also tagged `dev`)' )
          EOF
          )
          if [ "$CHANNEL" = "prod" ]; then
            TAG="v${PKG_VERSION}"
            PRERELEASE=False
          else
            TAG="dev-${PKG_VERSION}"
            PRERELEASE=True
          fi
          PAYLOAD=$(python3 -c 'import json,sys; print(json.dumps({"tag_name": sys.argv[1], "target_commitish": sys.argv[2], "name": sys.argv[1], "body": sys.argv[3], "prerelease": sys.argv[4] == "True"}))' "$TAG" "${{ github.sha }}" "$BODY" "$PRERELEASE")
          # Same idempotency principle as the package publish above: a retry
          # reuses the same PKG_VERSION/TAG, so skip instead of erroring on
          # the resulting 409 rather than failing a run that's actually fine.
          EXISTING=$(curl -sk -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.CD_DEPLOY_TOKEN }}" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/tags/$TAG")
          if [ "$EXISTING" = "200" ]; then
            echo "Release $TAG already exists, skipping."
          else
            curl -sk -X POST "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases" \
              -H "Authorization: token ${{ secrets.CD_DEPLOY_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"
          fi
