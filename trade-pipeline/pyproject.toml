[project]
name = "trade-pipeline"
version = "0.1.3"
description = "Real-time trade event pipeline with secure query API — Python prep project"
readme = "README.md"
authors = [
    { name = "Raju Bhimani", email = "raju.bhimani@hotmail.com" }
]
requires-python = ">=3.11,<3.15"

# `~=` (PEP 440 "compatible release"), not `>=`: allows patch/minor upgrades
# but blocks the next major version from ever being auto-resolved, so a
# `uv lock --upgrade` can't silently jump onto a release that dropped or
# renamed something this code depends on. Pre-1.0 packages are pinned at
# the minor level instead (`~=0.140.0`, not `~=0.140`) since 0.x releases
# treat a minor bump as their de facto major/breaking boundary. Floors
# match what uv.lock already resolved to, not the original historical
# floor — see docs/DECISIONS.md "Compatible-release version pins".
dependencies = [
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "confluent-kafka~=2.0",
    "redis~=8.0",
    "sqlalchemy[asyncio]~=2.0",
    "asyncpg~=0.31.0",
    "psycopg[binary]~=3.0",
    "alembic~=1.0",
    "argon2-cffi~=25.0",
    "fastapi~=0.140.0",
    "uvicorn[standard]~=0.51.0",
    "pyjwt~=2.0",
    "cryptography~=50.0",
    "structlog~=26.0",
    "prometheus-fastapi-instrumentator~=8.0",
    "prometheus-client~=0.26.0",
    "tenacity~=9.0",
    "aiohttp~=3.0",
]

# dagster/temporal split into their own groups (not base dependencies) so the
# api/producer/consumer image doesn't carry either SDK — see Dockerfile vs
# Dockerfile.dagster. Neither group is included by default (no
# tool.uv.default-groups override), so a plain `uv sync --no-default-groups`
# gets base deps only; `--group dagster` / `--group temporal` opt in.
[dependency-groups]
dev = [
    "pytest~=9.0",
    "pytest-asyncio~=1.0",
    "pytest-cov~=7.0",
    "ruff~=0.16.0",
    "mypy~=2.0",
    "pip-audit~=2.0",
    "httpx~=0.28.0",
    "pytest-xdist~=3.0",
    {include-group = "dagster"},
    {include-group = "temporal"},
]
dagster = [
    "dagster~=1.0",
    "dagster-webserver~=1.0",
    # 3.11-3.13 fallback for dagster_pipeline/archival.py's compression.zstd
    # (3.14 stdlib) usage — see that module for the compatibility shim. Marker
    # keeps this out of 3.14 environments entirely, where it's not needed.
    "zstandard~=0.25.0; python_version < '3.14'",
]
temporal = [
    "temporalio~=1.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    # Third-party libs we don't control the internals of — narrow, not blanket,
    # exceptions only. Remove an entry the moment its library fixes it upstream.
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "UP006",  # use PEP 585 builtin generics — fine to leave typing.X in 3.11-compat modules
    "UP007",  # use X | Y unions — same, applied opportunistically not repo-wide
]

[tool.ruff.lint.per-file-ignores]
# version_compat_demo.py deliberately keeps 3.11-style TypeVar/Generic imports
# and a `from __future__ import annotations` alongside 3.12+/3.14 forms, for
# the side-by-side comparison — pyupgrade/UP rules would "fix" away the point.
"src/trade_pipeline/common/version_compat_demo.py" = ["UP035", "UP040", "F401"]

[tool.mypy]
python_version = "3.11"
strict = true
