[project]
name = "trade-pipeline"
version = "0.1.0"
description = "Real-time trade event pipeline with secure query API — FAANG prep project"
readme = "README.md"
authors = [
    { name = "Raju Bhimani", email = "raju.bhimani@hotmail.com" }
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2.9",
    "confluent-kafka>=2.6",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyjwt>=2.9",
    "slowapi>=0.1.9",
    "structlog>=24.4",
    "prometheus-fastapi-instrumentator>=7.0",
    "tenacity>=9.0",
    "aiohttp>=3.10",
    "temporalio>=1.9",
    "dagster>=1.9",
    "dagster-webserver>=1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
