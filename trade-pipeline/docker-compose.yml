name: trade-pipeline

services:
  # Single-node Kafka in KRaft mode — no Zookeeper. Zookeeper-based Kafka is
  # deprecated (removed as of Kafka 4.x); the official apache/kafka image
  # supports KRaft (broker+controller in one process) out of the box, which
  # is simpler for a single-node local dev setup and matches current
  # upstream direction rather than the legacy Confluent+Zookeeper pairing.
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      # kafka-broker-api-versions.sh ships in every apache/kafka image at this
      # path — succeeds only once the broker is actually accepting requests,
      # not just once the process has started.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8.8-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:18.4-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: trade_pipeline
      POSTGRES_PASSWORD: trade_pipeline
      POSTGRES_DB: trade_pipeline
    volumes:
      # postgres 18+ images changed the expected mount point to the parent
      # dir (pg_ctlcluster-style major-version subdirectories) — mounting at
      # the old .../data path errors out on startup. See
      # https://github.com/docker-library/postgres/pull/1259
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade_pipeline -d trade_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-container Temporal dev server (embeds the `temporal` CLI's
  # `server start-dev`, sqlite-backed — no separate Cassandra/MySQL/Postgres
  # needed for Temporal itself, matching how kafka/redis/postgres above are
  # each single-node dev setups too). gRPC on 7233 (what the worker/API
  # connect to), Web UI on 8233.
  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0 --db-filename /home/temporal/temporal.db
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      # The image runs as uid 1000 ("temporal"), whose home dir is the only
      # path pre-owned by that user — a named volume mounted at a fresh path
      # like /data is created root:root, which the process then can't write
      # into (surfaces as a misleading SQLite "out of memory (14)" error).
      - temporal-data:/home/temporal
    healthcheck:
      # Same binary as the server itself (`temporal` CLI ships in this
      # image) — succeeds only once the frontend service is actually
      # accepting requests, not just once the process has started.
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # --- Application services. api/producer/consumer share the core Dockerfile
  # image (see its own header comment) — `command:` selects the entrypoint.
  # dagster and temporal-worker each have their own Dockerfile (Dockerfile.
  # dagster / Dockerfile.temporal) so their SDKs don't bloat the core image. ---

  # One-shot: generates the JWT RS256 keypair into the `keys` volume if it
  # doesn't already exist (see scripts/generate_keys.py — replaces the
  # README's manual `openssl genrsa` steps, since there's no host shell here
  # to run them against a container-only volume). `api` depends on this
  # completing, not just starting.
  keys-init:
    build: .
    command: python -m trade_pipeline.scripts.generate_keys
    volumes:
      - keys:/app/keys

  # One-shot: creates the `trades` table (+ partitions) before `api` or
  # `consumer` touch Postgres, so neither races the other into doing it
  # implicitly (see scripts/migrate.py).
  migrate:
    build: .
    command: python -m trade_pipeline.scripts.migrate
    environment:
      POSTGRES_DSN: postgresql+asyncpg://trade_pipeline:trade_pipeline@postgres:5432/trade_pipeline
    depends_on:
      postgres:
        condition: service_healthy

  producer:
    build: .
    command: python -m trade_pipeline.producer.fake_trades
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  consumer:
    build: .
    command: python -m trade_pipeline.consumer.dedup_consumer
    ports:
      - "8001:8001" # /metrics (see observability/metrics.py)
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql+asyncpg://trade_pipeline:trade_pipeline@postgres:5432/trade_pipeline
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    build: .
    command: uvicorn trade_pipeline.api.main:build_production_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql+asyncpg://trade_pipeline:trade_pipeline@postgres:5432/trade_pipeline
      CORS_ORIGINS: http://localhost:8000
    volumes:
      - keys:/app/keys
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keys-init:
        condition: service_completed_successfully

  dagster:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    ports:
      - "3000:3000"
    environment:
      POSTGRES_DSN: postgresql+asyncpg://trade_pipeline:trade_pipeline@postgres:5432/trade_pipeline
    volumes:
      - archive:/app/archive
    depends_on:
      migrate:
        condition: service_completed_successfully

  temporal-worker:
    build:
      context: .
      dockerfile: Dockerfile.temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      REDIS_URL: redis://redis:6379/0
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  keys:
  archive:
  temporal-data:
