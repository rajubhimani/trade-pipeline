[alembic]
script_location = migrations

# No sqlalchemy.url here on purpose — migrations/env.py resolves the DSN
# from trade_pipeline.common.config.load_config() (same POSTGRES_DSN env var
# / .env file every other entrypoint reads), so there's one source of truth
# for the connection string instead of a second copy living in this file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
